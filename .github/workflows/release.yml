name: Release

on:
  push:
    tags: ["@tsports/*@*"]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (e.g. go-colorful, uniseg)"
        required: true
        type: string
      dry_run:
        description: "Dry run (test without publishing)"
        required: false
        default: "false"
        type: boolean

env:
  NODE_VERSION: 22

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
      go_version: ${{ steps.parse.outputs.go_version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - name: Parse tag or inputs
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PACKAGE="${{ github.event.inputs.package }}"
          else
            # Tag format: @tsports/<package>@<version>
            TAG="${GITHUB_REF#refs/tags/}"
            # Extract package name: strip @tsports/ prefix and @version suffix
            PACKAGE=$(echo "$TAG" | sed -E 's|^@tsports/||; s|@[^@]+$||')
          fi

          PKG_DIR="packages/tsports/${PACKAGE}"

          if [ ! -d "$PKG_DIR" ]; then
            echo "::error::Package directory not found: $PKG_DIR"
            echo "Available packages:"
            ls packages/tsports/
            exit 1
          fi

          # Read version and metadata from the package's package.json
          VERSION=$(node -p "require('./${PKG_DIR}/package.json').version")
          GO_VERSION=$(node -p "require('./${PKG_DIR}/package.json').portInfo?.sourceVersion || 'unknown'")
          NPM_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")

          # Validate tag version matches package.json (for tag pushes)
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION=$(echo "${GITHUB_REF#refs/tags/}" | sed -E 's|^@tsports/[^@]+@||')
            if [ "$VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($VERSION)"
              exit 1
            fi
          fi

          if [[ "$VERSION" == *"-"* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "package=$PACKAGE" >> $GITHUB_OUTPUT
          echo "pkg_dir=$PKG_DIR" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "go_version=$GO_VERSION" >> $GITHUB_OUTPUT
          echo "npm_name=$NPM_NAME" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

          echo "## Release Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: $NPM_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Go Source**: $GO_VERSION" >> $GITHUB_STEP_SUMMARY

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install

      - name: Validate dependency versions match upstream go.mod
        run: bun run scripts/check-dep-versions.ts ${{ steps.parse.outputs.package }}

      - name: Build package
        working-directory: ${{ steps.parse.outputs.pkg_dir }}
        run: bun run build

      - name: Run tests
        working-directory: ${{ steps.parse.outputs.pkg_dir }}
        run: bun test

      - name: Dry run check
        if: github.event.inputs.dry_run == 'true'
        working-directory: ${{ steps.parse.outputs.pkg_dir }}
        run: |
          echo "DRY RUN MODE - Not publishing to NPM or creating release"
          npm pack --dry-run
          echo "Package would be published successfully"

      - name: Publish to NPM
        if: github.event.inputs.dry_run != 'true'
        working-directory: ${{ steps.parse.outputs.pkg_dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publishing ${{ steps.parse.outputs.npm_name }}@${{ steps.parse.outputs.version }}"
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish --access public --tag latest

      - name: Create GitHub Release
        if: github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.parse.outputs.npm_name }}@${{ steps.parse.outputs.version }}"
          prerelease: ${{ steps.parse.outputs.is_prerelease }}
          generate_release_notes: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('@tsports/{0}@{1}', steps.parse.outputs.package, steps.parse.outputs.version) || github.ref_name }}
          body: |
            ## ${{ steps.parse.outputs.npm_name }} v${{ steps.parse.outputs.version }}

            **Go Source Version**: ${{ steps.parse.outputs.go_version }}

            ### Install
            ```bash
            bun add ${{ steps.parse.outputs.npm_name }}@${{ steps.parse.outputs.version }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
