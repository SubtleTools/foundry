$schema: "https://moonrepo.dev/schemas/tasks.json"

# This file provides TypeScript-specific build tasks for TSPort packages
# Use this tag when a package needs tsc-based builds rather than bundlers

tasks:
  build:
    command: tsc
    args: ["--project", "tsconfig.build.json"]
    inputs:
      - "src/**/*"
      - "package.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
    outputs:
      - "dist/**/*"

  clean:
    command: bun
    args: ["-e", "const fs = require('fs'); ['dist', 'coverage'].forEach(d => fs.existsSync(d) && fs.rmSync(d, {recursive: true, force: true}))"]
    options:
      cache: false

  dev:
    command: tsc
    args: ["--watch"]
    local: true
    options:
      persistent: true

  typecheck:
    command: tsc
    args: ["--noEmit"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "package.json"