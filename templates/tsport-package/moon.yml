language: 'typescript'
type: 'library'

tasks:
  build:
    command: 'bun'
    args: ['tsc', '--project', 'tsconfig.build.json']
    deps: ['clean']
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
    outputs:
      - 'dist/**/*'

  clean:
    command: 'bun'
    args: ['-e', 'const fs = require("fs"); if (fs.existsSync("dist")) fs.rmSync("dist", {recursive: true, force: true})']

  dev:
    command: 'bun'
    args: ['run', '--watch', 'src/index.ts']
    local: true

  format:
    command: 'dprint'
    args: ['fmt']
    inputs:
      - 'src/**/*'
      - 'test/**/*'
      - '*.{json,md,yml,yaml}'
      - 'biome.json'
      - 'dprint.json'

  lint:
    command: 'biome'
    args: ['check', 'src', 'test', '--no-errors-on-unmatched', '--write']
    inputs:
      - 'src/**/*'
      - 'test/**/*'
      - 'biome.json'

  prepack:
    deps:
      - clean
      - lint
      - format
      - build
      - test

  test:
    command: 'bun'
    args: ['test']
    inputs:
      - 'src/**/*'
      - 'test/**/*'